# conex.yaml - Configuration for conex
#
# All options here are set to the default values. If no configuration file is
# found, then these values will be used.

# Enable development features like source locations in logs.
# Override with:
#   CONEX_DEV=true app serve
#   app serve --dev
dev: false

# Host or interface to bind to. Empty means the default bind behavior.
# Override with:
#   CONEX_HOST=127.0.0.1 app serve
#   app serve --host 127.0.0.1
host: ""

# TCP port to listen on.
# Override with:
#   CONEX_PORT=8080 app serve
#   app serve --port 8080
port: 3080

# Auth settings.
# Override with:
#   CONEX_AUTH_SECRET=change-me app serve
#   app serve --auth-secret change-me
#   CONEX_AUTH_ACCESS_TOKEN_TTL=15m app serve
#   app serve --auth-access-ttl 15m
#   CONEX_AUTH_REFRESH_TOKEN_TTL=720h app serve
#   app serve --auth-refresh-ttl 720h
auth:
  secret: ""
  access-token-ttl: 15m
  refresh-token-ttl: 720h

# Mail settings used to send OTP emails.
# Override with:
#   CONEX_MAIL_FROM=no-reply@conex.co.cr app serve
#   app serve --mail-from no-reply@conex.co.cr
#   CONEX_MAILGUN_DOMAIN=mg.conex.co.cr app serve
#   app serve --mailgun-domain mg.conex.co.cr
#   CONEX_MAILGUN_API_KEY=change-me app serve
#   app serve --mailgun-api-key change-me
#   CONEX_MAILGUN_API_BASE=https://api.eu.mailgun.net app serve
#   app serve --mailgun-api-base https://api.eu.mailgun.net
mail:
  from: "Conex <noreply@conex.co.cr>"
  mailgun:
    domain: mg.conex.co.cr
    api-key: ""
    api-base: ""

# CORS origins allowed to call the API from browser JavaScript.
# The default http://localhost entry allows any localhost port.
# Override with:
#   CONEX_CORS_ORIGINS=https://app.conex.co.cr,http://localhost app serve
#   app serve --cors-origin https://app.conex.co.cr --cors-origin http://localhost
cors:
  origins:
    - https://conex.co.cr
    - http://localhost

# Route prefix to mount the app under.
# Override with:
#   CONEX_ROOT=/app app serve
#   app serve --root /prefix
root: ""

# Public base URL used to build site response URLs.
# Override with:
#   CONEX_BASE_URL=https://conex.co.cr app serve
#   app serve --base-url https://conex.co.cr
base-url: https://conex.co.cr

# Object storage settings.
# Override with:
#   CONEX_STORAGE_BACKEND=fs app serve
#   app serve --storage-backend fs
#   CONEX_FS_ROOT=./conex-data/root app serve
#   app serve --storage-fs-root ./conex-data/root
#   CONEX_FS_MAX_SIZE=10737418240 app serve
#   app serve --storage-fs-max-size 10737418240
#   CONEX_S3_PRIVATE_BUCKET=my-private-bucket app serve
#   app serve --storage-s3-private-bucket my-private-bucket
#   CONEX_S3_PUBLIC_BUCKET=my-public-bucket app serve
#   app serve --storage-s3-public-bucket my-public-bucket
#   CONEX_S3_ACCESS_KEY_ID=change-me app serve
#   app serve --storage-s3-access-key-id change-me
#   CONEX_S3_SECRET_ACCESS_KEY=change-me app serve
#   app serve --storage-s3-secret-access-key change-me
#   CONEX_S3_REGION=auto app serve
#   app serve --storage-s3-region auto
#   CONEX_S3_ENDPOINT=https://example.invalid app serve
#   app serve --storage-s3-endpoint https://example.invalid
#   CONEX_S3_PUBLIC_ENDPOINT_URL=https://public.example.invalid app serve
#   app serve --storage-s3-public-endpoint-url https://public.example.invalid
#   CONEX_S3_MAX_SIZE=10737418240 app serve
#   app serve --storage-s3-max-size 10737418240
storage:
  backend: fs
  fs:
    root: ./conex-data/root
    max-size: 10737418240
  s3:
    private-bucket: ""
    public-bucket: ""
    access-key-id: ""
    secret-access-key: ""
    region: auto
    endpoint: ""
    public-endpoint-url: ""
    max-size: 10737418240

# Log output format. Valid values: json, text.
# Override with:
#   CONEX_LOGFMT=text app serve
#   app serve --logfmt text
logfmt: json

# Minimum log level. Valid values: debug, info, warn, error.
# Override with:
#   CONEX_LOGLVL=debug app serve
#   app serve --loglvl debug
loglvl: info

# Database connection string or path.
# Override with:
#   CONEX_DB=conex-data/custom.sqlite app serve
#   app serve --db conex-data/custom.sqlite
db: conex-data/conex.sqlite
