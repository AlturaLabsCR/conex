openapi: 3.1.0
info:
  title: Conex API
  version: 0.1.0
  description: OpenAPI specification of App.
servers:
  - url: https://conex.co.cr
tags:
  - name: Legal
  - name: Authentication
  - name: Account
  - name: Sites
paths:
  /tos:
    get:
      tags:
        - Legal
      operationId: getTermsOfService
      summary: Render the Terms of Service
      responses:
        '200':
          description: Terms of Service HTML.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /privacy:
    get:
      tags:
        - Legal
      operationId: getPrivacyPolicy
      summary: Render the Privacy Policy
      responses:
        '200':
          description: Privacy Policy HTML.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /{path}:
    get:
      tags:
        - Sites
      operationId: getSite
      summary: Render a public site
      parameters:
        - $ref: '#/components/parameters/SitePath'
      responses:
        '200':
          description: Public site HTML.
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /api/auth/login:
    post:
      tags:
        - Authentication
      operationId: loginOrCreateAccount
      summary: Trigger login or account creation
      description: Triggers a confirmation email containing a temporary 6-digit verification code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: john@doe.com
      responses:
        '204':
          description: Verification email sent.
        default:
          $ref: '#/components/responses/Error'
  /api/auth/verify:
    post:
      tags:
        - Authentication
      operationId: verifyAuthenticationCode
      summary: Verify email code
      description: Verifies the provided email and 6-digit code, then creates a new session. If no account exists for the email address, a new account is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            example:
              email: john@doe.com
              otp: 123456
      responses:
        '200':
          description: Verified account and created session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
              example:
                access_token: eyJhbGciOa...
                refresh_token: X4fFxvY89ypw5f...
                expires_in: 900
                refresh_token_expires_in: 5184000
        default:
          $ref: '#/components/responses/Error'
  /api/auth/refresh:
    post:
      tags:
        - Authentication
      operationId: refreshSession
      summary: Refresh session tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: X4fFxvY89ypw5f...
      responses:
        '200':
          description: Refreshed tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
              example:
                access_token: eyJhbGciOiJIU...
                refresh_token: eyJhbGciOiJIU...
                expires_in: 900
                refresh_token_expires_in: 5184000
        default:
          $ref: '#/components/responses/Error'
  /api/account:
    get:
      tags:
        - Account
      operationId: getAccount
      summary: Get account details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                sub: 1
                email: john@doe.com
                created_at: 1777872664
                subscription:
                  status: active
                  due_date: ''
                  plan:
                    id: free
                    name: Free
                    price:
                      amount: 0
                      currency: USD
                    billing_period:
                      unit: ''
                      count: 0
                    supports_renewal: false
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Account
      operationId: deleteAccount
      summary: Delete account
      description: Deletes the authenticated account.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deleted.
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        default:
          $ref: '#/components/responses/Error'
  /api/account/email/change:
    patch:
      tags:
        - Account
      operationId: requestEmailChange
      summary: Request an email address change
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
            example:
              new_email: new@email.com
      responses:
        '204':
          description: Email change request accepted.
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        default:
          $ref: '#/components/responses/Error'
  /api/account/email/change/confirm:
    patch:
      tags:
        - Account
      operationId: confirmEmailChange
      summary: Confirm an email address change
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailConfirmRequest'
            example:
              otp: 123456
      responses:
        '204':
          description: Email change confirmed.
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        default:
          $ref: '#/components/responses/Error'
  /api/sites:
    post:
      tags:
        - Sites
      operationId: createSite
      summary: Create a site
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
            example:
              path: go-fitness
              name: Go Fitness
              tags:
                - fitness
                - wellness
              html: <h1>Hello</h1>
      responses:
        '201':
          description: Site created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
              example:
                path: go-fitness
                public: false
                name: Go Fitness
                tags:
                  - fitness
                  - wellness
                url: https://conex.co.cr/go-fitness
                sub: 1
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
        - Sites
      operationId: listSites
      summary: List owned sites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sites owned by the authenticated account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
              example:
                - path: go-fitness
                  public: false
                  name: Go Fitness
                  tags:
                    - fitness
                    - wellness
                  url: https://conex.co.cr/go-fitness
                  sub: 1
                - path: personal-blog
                  public: true
                  name: Personal Blog
                  tags:
                    - writing
                  url: https://conex.co.cr/personal-blog
                  sub: 1
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        default:
          $ref: '#/components/responses/Error'
  /api/sites/{path}:
    head:
      tags:
        - Sites
      operationId: sitePathAvailable
      summary: Check whether a site path is available
      parameters:
        - $ref: '#/components/parameters/SitePath'
      responses:
        '204':
          description: Site path is available.
        '409':
          description: Site path is already in use or reserved by another route.
        default:
          $ref: '#/components/responses/Error'
    get:
      tags:
        - Sites
      operationId: getOwnedSite
      summary: Get owned site metadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SitePath'
      responses:
        '200':
          description: Owned site metadata and stored HTML.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnedSite'
              example:
                path: go-fitness
                public: true
                name: Go Fitness
                tags:
                  - fitness
                  - wellness
                url: https://conex.co.cr/go-fitness
                sub: 1
                html: <h1>Hello</h1>
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
        - Sites
      operationId: updateSite
      summary: Update a site
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SitePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
            example:
              public: true
              name: Go Fitness Club
              tags:
                - fitness
                - health
              html: <h1>Hello again</h1>
      responses:
        '204':
          description: Site updated.
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Sites
      operationId: deleteSite
      summary: Delete a site
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SitePath'
      responses:
        '204':
          description: Site deleted.
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ReauthenticationRequired:
      description: The bearer access token is missing, invalid, or expired. The client should reauthenticate the user.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    SitePath:
      name: path
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 255
        pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    VerifyRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
        otp:
          type: integer
          description: Six-digit one-time password.
          minimum: 0
          maximum: 999999
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    SessionTokens:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - expires_in
        - refresh_token_expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          minimum: 0
        refresh_token_expires_in:
          type: integer
          minimum: 0
    VerifyResponse:
      $ref: '#/components/schemas/SessionTokens'
    RefreshResponse:
      $ref: '#/components/schemas/SessionTokens'
    Account:
      type: object
      additionalProperties: false
      required:
        - sub
        - email
        - created_at
        - subscription
      properties:
        sub:
          type: integer
        email:
          type: string
          format: email
        created_at:
          type: integer
          description: Account creation timestamp.
        subscription:
          $ref: '#/components/schemas/Subscription'
    Subscription:
      type: object
      additionalProperties: false
      required:
        - status
        - due_date
        - plan
      properties:
        status:
          type: string
        due_date:
          type: string
          description: Subscription due date as YYYY-MM-DD, or empty for non-renewing plans.
        plan:
          $ref: '#/components/schemas/Plan'
    Plan:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - price
        - billing_period
        - supports_renewal
      properties:
        id:
          type: string
        name:
          type: string
          description: Localized plan display name.
        price:
          $ref: '#/components/schemas/PlanPrice'
        billing_period:
          $ref: '#/components/schemas/BillingPeriod'
        supports_renewal:
          type: boolean
    PlanPrice:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
        currency:
          type: string
    BillingPeriod:
      type: object
      additionalProperties: false
      required:
        - unit
        - count
      properties:
        unit:
          type: string
        count:
          type: integer
    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required:
        - new_email
      properties:
        new_email:
          type: string
          format: email
    ChangeEmailConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - otp
      properties:
        otp:
          type: integer
          description: Six-digit one-time password.
          minimum: 0
          maximum: 999999
    CreateSiteRequest:
      type: object
      additionalProperties: false
      required:
        - path
        - name
        - tags
        - html
      properties:
        path:
          type: string
          minLength: 3
          maxLength: 255
          pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
        name:
          type: string
          minLength: 1
          maxLength: 255
        tags:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64
          uniqueItems: true
        html:
          type: string
          maxLength: 268435456
    UpdateSiteRequest:
      type: object
      additionalProperties: false
      properties:
        public:
          type: boolean
        name:
          type: string
          minLength: 1
          maxLength: 255
        tags:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64
          uniqueItems: true
        html:
          type: string
          maxLength: 268435456
    Site:
      type: object
      additionalProperties: false
      required:
        - sub
        - path
        - public
        - name
        - tags
        - url
      properties:
        sub:
          type: integer
        path:
          type: string
        public:
          type: boolean
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        url:
          type: string
          description: Public site URL built from the configured base URL and site path.
    OwnedSite:
      allOf:
        - $ref: '#/components/schemas/Site'
        - type: object
          additionalProperties: false
          required:
            - html
          properties:
            html:
              type: string
    Error:
      type: object
      description: Generic error payload shape when the server returns JSON errors.
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - msg
          properties:
            msg:
              type: string
